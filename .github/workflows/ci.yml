# Sinkon continuous integration: lint, unit tests, allocation gate, Android build.
#
# Nothing here has run yet — the repository was produced in a sandbox without a Rust
# toolchain, an NDK or Gradle (docs/KNOWN_ISSUES.md SINKON-001/002). These workflows
# are the first place the code will actually be compiled, so treat a red build as
# expected on the first push and fix forward.
name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt / clippy / test (host)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-ci-

      - name: rustfmt (advisory)
        # The sources were written without a local toolchain, so formatting drift is
        # expected on the first CI run. Flip this to blocking once `cargo fmt` has
        # been run and committed (docs/KNOWN_ISSUES.md SINKON-002).
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: unit tests
        run: cargo test --all-targets

      - name: allocation gate (zero allocations in the frame path)
        run: cargo test --features alloc-gate

      - name: benches compile
        run: cargo bench --bench sinkon_benches --no-run

  android:
    name: build libsinkon.so (aarch64, armv7, x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-android-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./scripts/build-android.sh

      - name: Upload the native libraries
        uses: actions/upload-artifact@v4
        with:
          name: libsinkon
          path: android/app/src/main/jniLibs/**/libsinkon.so
          if-no-files-found: error
          retention-days: 14
